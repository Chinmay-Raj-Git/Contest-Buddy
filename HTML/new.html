<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contest Buddy</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>

<body
  class="font-[Roboto] min-h-screen transition-colors duration-300
  bg-gradient-to-br from-emerald-400 to-green-400
  dark:bg-gradient-to-br dark:from-slate-900 dark:to-emerald-950
  flex flex-col items-center"
>

  <!-- NAVBAR -->
  <nav
    class="w-full px-8 py-6 flex justify-between items-center
    bg-gradient-to-r from-emerald-700 to-green-600
    dark:from-emerald-900 dark:to-slate-900
    text-white shadow-lg"
  >
    <h1 class="text-3xl font-semibold">
      Contest Buddy <i class="fa-solid fa-robot ml-2"></i>
    </h1>

    <button onclick="toggleTheme()" class="text-2xl hover:text-emerald-300 transition">
      <i id="theme-icon" class="fa-solid fa-moon"></i>
    </button>
  </nav>

  <!-- EMAIL CTA -->
  <div class="flex flex-col items-center justify-center mt-16 mb-12 px-6">
    <input
      type="email"
      placeholder="your@mail.com"
      class="w-full max-w-lg text-lg px-6 py-4 rounded-2xl
      border border-emerald-200
      bg-white text-gray-800
      dark:bg-slate-800 dark:text-white dark:border-emerald-700
      focus:ring-4 focus:ring-emerald-500/30 outline-none transition"
    />

    <button
      class="mt-6 px-10 py-4 rounded-2xl text-lg font-medium text-white
      bg-gradient-to-r from-emerald-600 to-green-600
      hover:from-emerald-500 hover:to-green-500
      shadow-lg hover:shadow-xl transition"
    >
      Start receiving reminders
      <i class="fa-solid fa-arrow-right ml-2"></i>
    </button>
  </div>

  <!-- PREFERENCES PANEL -->
  <div
    class="w-11/12 max-w-6xl mb-12 rounded-3xl p-8
    bg-white/80 backdrop-blur-xl
    dark:bg-slate-900/80
    shadow-2xl transition"
  >
    <h2
      class="text-center text-3xl font-semibold mb-10
      text-emerald-700 dark:text-emerald-400"
    >
      Your Preferences
    </h2>

    <div class="grid md:grid-cols-2 gap-8">

      <!-- PLATFORMS -->
      <div
        class="rounded-2xl p-6
        bg-gradient-to-r from-emerald-100 to-green-100
        dark:from-slate-800 dark:to-slate-900
        shadow-xl"
      >
        <h3 class="text-2xl font-medium mb-6 text-emerald-800 dark:text-emerald-400">
          Platforms
        </h3>

        <div class="space-y-6">
          <!-- Platform Toggle -->
          <div class="flex justify-between items-center">
            <span class="text-lg dark:text-gray-200">LeetCode</span>
            <label class="inline-flex cursor-pointer">
              <input type="checkbox" class="sr-only peer">
              <div class="w-14 h-8 bg-gray-300 dark:bg-slate-700 rounded-full
                peer-checked:bg-emerald-500
                after:content-[''] after:absolute after:top-1 after:left-1
                after:w-6 after:h-6 after:bg-white after:rounded-full
                peer-checked:after:translate-x-6 after:transition"></div>
            </label>
          </div>

          <div class="flex justify-between items-center">
            <span class="text-lg dark:text-gray-200">CodeChef</span>
            <label class="inline-flex cursor-pointer">
              <input type="checkbox" class="sr-only peer">
              <div class="w-14 h-8 bg-gray-300 dark:bg-slate-700 rounded-full
                peer-checked:bg-emerald-500
                after:content-[''] after:absolute after:top-1 after:left-1
                after:w-6 after:h-6 after:bg-white after:rounded-full
                peer-checked:after:translate-x-6 after:transition"></div>
            </label>
          </div>
        </div>
      </div>

      <!-- ALERT SETTINGS -->
      <div
        class="rounded-2xl p-6
        bg-gradient-to-r from-emerald-100 to-green-100
        dark:from-slate-800 dark:to-slate-900
        shadow-xl"
      >
        <h3 class="text-2xl font-medium mb-6 text-emerald-800 dark:text-emerald-400">
          Alert Settings
        </h3>

        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <span class="text-lg dark:text-gray-200">1 Hour Before</span>
            <input type="checkbox" class="accent-emerald-600 w-5 h-5">
          </div>

          <div class="flex justify-between items-center">
            <span class="text-lg dark:text-gray-200">10 Minutes Before</span>
            <input type="checkbox" class="accent-emerald-600 w-5 h-5">
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- THEME SCRIPT -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById("theme-icon");

      html.classList.toggle("dark");

      if (html.classList.contains("dark")) {
        localStorage.theme = "dark";
        icon.classList.replace("fa-moon", "fa-sun");
      } else {
        localStorage.theme = "light";
        icon.classList.replace("fa-sun", "fa-moon");
      }
    }

    // Load saved theme
    document.addEventListener("DOMContentLoaded", () => {
      const icon = document.getElementById("theme-icon");
      if (
        localStorage.theme === "dark" ||
        (!("theme" in localStorage) &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
        icon.classList.replace("fa-moon", "fa-sun");
      }
    });
  </script>

</body>
</html>
