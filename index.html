<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contest Buddy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>

<body
  class="font-[Roboto] bg-gradient-to-br from-emerald-400 to-green-400 w-[100vw] h-[100vh] flex flex-col items-center justify-center">
  <h1 class="my-8 text-5xl font-medium bg-clip-text text-transparent bg-gradient-to-r from-gray-700 to-slate-800">
    Hello there, Contender!
  </h1>

  <div class="flex flex-col items-center justify-center m-4">
    <input type="email" class="text-xl w-full my-2 py-4 px-6 rounded-2xl ring-1 ring-emerald-950 border border-emerald-100
                                    placeholder:text-xl" placeholder="your@mail.com">
    <button class="m-4 py-4 px-8 rounded-2xl text-xl bg-gradient-to-r text-white from-emerald-700 to-green-600
                        hover:from-emerald-500 hover:to-green-500 hover:text-emerald-100">
      Start receiving reminders <i class="px-2 fa-solid fa-arrow-right"></i>
    </button>
  </div>

  <div class="flex flex-col items-center justify-center m-4 mb-8 py-4 px-6 w-5/6 h-6/12 bg-gradient-to-r from-emerald-200 to-green-200
                rounded-xl">
    <h2
      class="w-full py-4 px-6 mb-8 mx-8 rounded-xl bg-gradient-to-r from-emerald-700 to-green-600 text-center text-3xl text-white">
      Your Preferences
    </h2>
    <!-- ------------CUSTOMISATION PANEL------------ -->
    <div class="flex flex-row justify-center items-center w-full text-xl">
      <!-- ------------CONTEST PLATFORMS SELECTION------------ -->
      <div class="mx-4 my-4 text-2xl rounded-xl bg-gradient-to-r from-emerald-100 to-green-100 drop-shadow-xl w-full">

        <h2 class="text-3xl mt-4 mx-4 mb-1 text-emerald-800 font-medium">Platforms</h2>
        <hr class="border border-emerald-800 mx-4 mb-4 drop-shadow-md">

        <div class="flex flex-col justify-center gap-8 p-6 text-xl">
          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/leetcode.png" class="inline-block text-sm px-2 mb-1" alt="">LeetCode</label>
            <!-- TOGGLE SWITCH FOR LeetCode -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>

          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/codechef.png" class="inline-block text-sm px-2 mb-1" alt="">CodeChef</label>

            <!-- TOGGLE SWITCH FOR CodeChef -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>

          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/codeforces.png" class="inline-block text-sm px-2 mb-1"
                alt="">CodeForces</label>
            <!-- TOGGLE SWITCH FOR CodeForces -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/geeksforgeeks.png" class="inline-block text-sm px-2 mb-1"
                alt="">GeeksForGeeks</label>
            <!-- TOGGLE SWITCH FOR GFG -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/hackerrank.png" class="inline-block text-sm px-2 mb-1"
                alt="">HackerRank</label>
            <!-- TOGGLE SWITCH FOR HackerRank -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for=""><img src="images/topcoder.png" class="inline-block text-sm px-2 mb-1" alt="">TopCoder</label>
            <!-- TOGGLE SWITCH FOR  TopCoder-->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>
        </div>

      </div>
      <!-- ------------END OF CONTEST PLATFORMS SELECTION------------ -->



      <!-- ------------REMINDER CUSTOMISATION------------ -->
      <div class="mx-4 my-4 text-2xl rounded-xl bg-gradient-to-r from-green-100 to-green-100 drop-shadow-xl w-full">

        <h2 class="text-3xl mt-4 mx-4 mb-1 text-emerald-800 font-medium">Alert Settings</h2>

        <hr class="border border-emerald-800 mx-4 mb-4 drop-shadow-md">
        <div class="flex flex-col justify-center gap-8 p-6 text-xl">
          <span class="flex flex-row justify-between gap-16">
            <label for="">An Hour Before</label>
            <!-- TOGGLE SWITCH -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for="">30 Mins Before</label>
            <!-- TOGGLE SWITCH -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

          <span class="flex flex-row justify-between gap-16">
            <label for="">10 Mins Before</label>
            <!-- TOGGLE SWITCH -->
            <label class="inline-flex items-center cursor-pointer">
              <input type="checkbox" value="" class="sr-only peer">
              <div
                class="relative w-14 h-8 bg-emerald-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-green-600/50 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-buffer after:content-[''] after:absolute after:top-[4px] after:start-[4px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500">
              </div>
            </label>
          </span>

        </div>
      </div>
      <!-- ------------END OF REMINDER CUSTOMISATION------------ -->


    </div>
    <!-- ------------END OF CUSTOMISATION PANEL------------ -->

  </div>
</body>

</html>
